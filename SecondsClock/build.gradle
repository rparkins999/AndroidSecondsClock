// Module build file
plugins {
    id 'com.android.application'
}

def buildTimestamp = new Date()
def generatedIconDir = layout.buildDirectory.dir("generated/launcherIconRes")
def launcherIconSvg = file("seconds-clock-icon.svg")
def configuredRsvgConvertExecutable = providers.gradleProperty("rsvgConvertExecutable")
def rsvgConvertExecutable = configuredRsvgConvertExecutable.orElse("rsvg-convert")

tasks.register("generateLauncherIcon") {
    inputs.file(launcherIconSvg)
    inputs.property("buildTimestamp", buildTimestamp.time)
    inputs.property("rsvgConvertExecutable", rsvgConvertExecutable)
    outputs.file(generatedIconDir.map { it.file("drawable/ic_launcher.png") })
    doLast {
        def fallbackIcon = file("src/main/res/drawable/ic_launcher.png")
        def output = generatedIconDir.get().file("drawable/ic_launcher.png").asFile
        def converterAvailable = false
        try {
            def versionOutput = new ByteArrayOutputStream()
            def versionCheck = project.exec {
                executable rsvgConvertExecutable.get()
                args "--version"
                standardOutput = versionOutput
                errorOutput = versionOutput
                ignoreExitValue = true
            }
            converterAvailable = versionCheck.exitValue == 0
        } catch (Exception ignored) {
            converterAvailable = false
        }
        if (!converterAvailable) {
            if (configuredRsvgConvertExecutable.isPresent()) {
                throw new GradleException(
                        "Configured rsvg-convert executable '${rsvgConvertExecutable.get()}' is unavailable")
            }
            if (!fallbackIcon.isFile()) {
                throw new GradleException(
                        "rsvg-convert is unavailable and the checked-in launcher icon is missing")
            }
            if (output.exists() && !output.delete()) {
                throw new GradleException(
                        "Could not remove a stale generated launcher icon")
            }
            logger.lifecycle(
                    "${rsvgConvertExecutable.get()} is unavailable; using the checked-in launcher icon")
            return
        }

        def svg = launcherIconSvg.getText("UTF-8")
        def timeText = new java.text.SimpleDateFormat(
                "HH:mm:ss", java.util.Locale.ENGLISH).format(buildTimestamp)
        def dateText = new java.text.SimpleDateFormat(
                "dd.MM.yyyy", java.util.Locale.ENGLISH)
                .format(buildTimestamp)

        def replaceText = { String source, String elementId, String value ->
            def pattern = java.util.regex.Pattern.compile(
                    "(?s)(<text\\s+id=\"" + elementId + "\"[^>]*>).*?(</text>)")
            def matcher = pattern.matcher(source)
            if (!matcher.find()) {
                throw new GradleException(
                        "SVG is missing the build-time text element '${elementId}'")
            }
            matcher.replaceFirst(java.util.regex.Matcher.quoteReplacement(
                    matcher.group(1) + value + matcher.group(2)))
        }
        svg = replaceText(svg, "build-time", timeText)
        svg = replaceText(svg, "build-date", dateText)

        output.parentFile.mkdirs()
        // This edited SVG is only an intermediate; Android consumes the PNG in generatedIconDir.
        def generatedSvg = new File(temporaryDir, "seconds-clock-icon.svg")
        generatedSvg.setText(svg, "UTF-8")
        try {
            project.exec {
                executable rsvgConvertExecutable.get()
                args "--width", "512", "--height", "512",
                        "--output", output.absolutePath, generatedSvg.absolutePath
            }
        } catch (Exception exception) {
            throw new GradleException(
                    "Could not regenerate the launcher icon. Install rsvg-convert and retry.",
                    exception)
        }
        if (!output.isFile() || output.length() == 0) {
            throw new GradleException("rsvg-convert did not create the launcher PNG")
        }
        logger.lifecycle("Generated timestamped launcher icon at ${output}")
    }
}

// git data for timestamp in code
def gitdata1 = new ByteArrayOutputStream()
def gitdata2 = new ByteArrayOutputStream()
def gitdata3 = new ByteArrayOutputStream()
// change this line to /* if not using git
exec {
    commandLine "git", "--no-pager", "show", "-s",
            "--format=from commit %H"
    standardOutput = gitdata1
}
exec {
    commandLine "git", "--no-pager", "show", "-s",
            "--date=format:%H:%M:%S GMT%z %a %b %d %Y",
            "--format=of %ad"
    standardOutput = gitdata2
}
exec {
    commandLine "git", "branch", "--show-current"
    standardOutput = gitdata3
}

// When rsvg-convert is available, the timestamped SVG overrides the checked-in
// fallback PNG. Standard Android/F-Droid builds can use the fallback as-is.

// Update these three to make new version
def VERSIONCODE = 86
def VERSIONNAME = "2.6.0"

def explicitKeystorePropertiesPath = findProperty("keystorePropertiesFile")
        ?: System.getenv("SECONDSCLOCK_KEYSTORE_PROPERTIES")
File keystorePropertiesFile
if (explicitKeystorePropertiesPath) {
    keystorePropertiesFile = file(explicitKeystorePropertiesPath.toString())
    if (!keystorePropertiesFile.isFile()) {
        throw new GradleException(
                "Configured signing properties file does not exist: ${keystorePropertiesFile}")
    }
} else {
    File localKeystorePropertiesFile = rootProject.file("local/keystore.properties")
    File legacyKeystorePropertiesFile = rootProject.file("../Keys/keystore.properties")
    keystorePropertiesFile = localKeystorePropertiesFile.isFile()
            ? localKeystorePropertiesFile : legacyKeystorePropertiesFile
}

def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.isFile()
if (hasSigningConfig) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    ["keyAlias", "keyPassword", "storeFile", "storePassword"].each { propertyName ->
        if (!keystoreProperties.getProperty(propertyName)) {
            throw new GradleException(
                    "Signing properties file is missing '${propertyName}'")
        }
    }
} else {
    logger.lifecycle(
            "No local signing properties found; debug uses the Android debug key and release APKs are unsigned")
}

android {
    compileSdkVersion 28

    sourceSets {
        debug.res.srcDir(generatedIconDir)
        release.res.srcDir(generatedIconDir)
    }

    signingConfigs {
        if (hasSigningConfig) {
            config {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    defaultConfig {
        applicationId "uk.co.yahoo.p1rpp.secondsclock"
        versionCode VERSIONCODE
        versionName VERSIONNAME
        minSdk 26
        //noinspection ExpiredTargetSdkVersion
        targetSdk 26
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (hasSigningConfig) {
                signingConfig signingConfigs.config
            }
            delete("build/intermediates/incremental/mergeReleaseResources/merger.xml")
            resValue("string", 'build_time', "${buildTimestamp.toString()}")
            resValue("string", 'build_git1', "${gitdata1.toString()}")
            resValue("string", 'build_git2', "${gitdata2.toString()}")
            resValue("string", 'build_git3',
                    "${" on branch " + gitdata3.toString()}")
        }
        debug {
            if (hasSigningConfig) {
                signingConfig signingConfigs.config
            }
            delete("build/intermediates/incremental/mergeDebugResources/merger.xml")
            resValue("string", 'build_time', "${buildTimestamp.toString()}")
            resValue("string", 'build_git1', "${gitdata1.toString()}")
            resValue("string", 'build_git2', "${gitdata2.toString()}")
            resValue("string", 'build_git3',
                    "${" on branch " + gitdata3.toString()}")
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'uk.co.yahoo.p1rpp.secondsclock'
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("generateLauncherIcon"))
}

dependencies {
    implementation 'com.google.android.material:material:1.4.0'
    testImplementation 'junit:junit:4.13.2'
}
