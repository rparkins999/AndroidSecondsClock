name: Android widget compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  widget-host:
    name: RemoteViews seconds on API ${{ matrix.android-api }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - android-api: '26'
            sdk-level: '26'
            image-package: 'system-images;android-26;google_apis;x86_64'
            image-path: 'system-images/android-26/google_apis/x86_64'
            avd-target: 'android-26'
            avd-device: 'pixel_2'
          - android-api: '37.0 (Android 17 base stable)'
            sdk-level: '37.0'
            image-package: 'system-images;android-37.0;google_apis;x86_64'
            image-path: 'system-images/android-37.0/google_apis/x86_64'
            avd-target: 'android-37.0'
            avd-device: 'pixel_2'
          - android-api: '37.2 (current stable)'
            sdk-level: '37.2'
            image-package: 'system-images;android-37.2;google_apis_ps16k;x86_64'
            image-path: 'system-images/android-37.2/google_apis_ps16k/x86_64'
            avd-target: 'android-37.2'
            avd-device: 'pixel_2'
          - android-api: '37.1 Beta 3 (QPR2)'
            sdk-level: '37.2-beta3'
            image-package: 'system-images;android-37.2-beta3;google_apis_ps16k;x86_64'
            image-path: 'system-images/android-37.2-beta3/google_apis_ps16k/x86_64'
            avd-target: 'android-37.2-beta3'
            avd-device: ''
          - android-api: '37.2 Canary (2026-11-04)'
            sdk-level: 'canary-20261104'
            image-package: 'system-images;android-canary-20261104;google_apis_ps16k;x86_64'
            image-path: 'system-images/android-canary-20261104/google_apis_ps16k/x86_64'
            avd-target: 'android-canary-20261104'
            avd-device: ''
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Older avdmanager versions silently write target=android-0 for dotted APIs (37.0).
          cmdline-tools-version: '15859902'
          packages: platform-tools

      - name: Enable KVM access
        if: ${{ !env.ACT }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator image
        env:
          ANDROID_API: ${{ matrix.sdk-level }}
          ANDROID_IMAGE_PACKAGE: ${{ matrix.image-package }}
          ANDROID_IMAGE_PATH: ${{ matrix.image-path }}
          ANDROID_AVD_TARGET: ${{ matrix.avd-target }}
          ANDROID_AVD_DEVICE: ${{ matrix.avd-device }}
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --channel=3 --install \
            'platforms;android-28' \
            'build-tools;34.0.0' \
            "platforms;android-${ANDROID_API}" \
            "${ANDROID_IMAGE_PACKAGE}" \
            emulator >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          avd_device_args=()
          if [[ -n "$ANDROID_AVD_DEVICE" ]]; then
            avd_device_args+=(--device "$ANDROID_AVD_DEVICE")
          fi
          echo no | avdmanager create avd --force -n widget-test \
            --package "${ANDROID_IMAGE_PACKAGE}" \
            "${avd_device_args[@]}" \
            --path "$ANDROID_AVD_HOME/widget-test.avd"
          avd_config="$ANDROID_AVD_HOME/widget-test.ini"
          if ! grep -Fxq "target=${ANDROID_AVD_TARGET}" "$avd_config"; then
            echo "Unexpected AVD target: expected ${ANDROID_AVD_TARGET}, got:"
            grep '^target=' "$avd_config" || true
            exit 1
          fi
          image_config="$ANDROID_AVD_HOME/widget-test.avd/config.ini"
          if ! grep -Fxq "image.sysdir.1=${ANDROID_IMAGE_PATH}/" "$image_config"; then
            echo "Unexpected system image path: expected ${ANDROID_IMAGE_PATH}/, got:"
            grep '^image.sysdir.1=' "$image_config" || true
            exit 1
          fi
          printf 'hw.cpu.ncore=2\ndisk.dataPartition.size=4G\n' \
            >> "$ANDROID_AVD_HOME/widget-test.avd/config.ini"

      - name: Build AppWidgetHost compatibility APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run AppWidgetHost compatibility test
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -port 5554 -avd widget-test -no-window \
            -gpu software -noaudio -no-boot-anim -no-metrics \
            -memory 3072 -cores 2 \
            -camera-back none -no-snapshot &
          emulator_pid=$!
          logcat_file="$RUNNER_TEMP/android-widget-logcat.txt"
          logcat_pid=
          deadline=$((SECONDS + 600))

          cleanup() {
            result=$?
            trap - EXIT
            if [[ $result -ne 0 ]]; then
              timeout 15 adb -s emulator-5554 shell df -h /data || true
              timeout 15 adb -s emulator-5554 shell service check package || true
              timeout 20 adb -s emulator-5554 logcat -b all -d -t 1000 || true
            fi
            if [[ -n "$logcat_pid" ]]; then
              kill "$logcat_pid" 2>/dev/null || true
              wait "$logcat_pid" 2>/dev/null || true
            fi
            if [[ $result -ne 0 && -f "$logcat_file" ]]; then
              echo 'Captured emulator logcat (last 400 lines):'
              tail -n 400 "$logcat_file"
            fi
            timeout 10 adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          timeout 180 adb -s emulator-5554 wait-for-device
          adb -s emulator-5554 logcat -b all -v threadtime >"$logcat_file" 2>&1 &
          logcat_pid=$!

          ready=0
          while (( SECONDS < deadline )); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo 'Emulator exited before Android became ready.'
              break
            fi
            state=$(timeout 15 adb -s emulator-5554 get-state 2>/dev/null || true)
            boot_completed=$(timeout 15 adb -s emulator-5554 shell getprop sys.boot_completed \
              2>/dev/null | tr -d '\r' || true)
            if [[ $state == device && $boot_completed == 1 ]]; then
              services_ready=1
              for service in input settings package activity appwidget; do
                service_status=$(timeout 15 adb -s emulator-5554 shell service check "$service" \
                  2>&1 | tr -d '\r' || true)
                if ! grep -Fxq "Service $service: found" <<< "$service_status"; then
                  services_ready=0
                  break
                fi
              done
              if [[ $services_ready -eq 1 ]]; then
                package_probe=$(timeout 15 adb -s emulator-5554 shell pm path android \
                  2>/dev/null | tr -d '\r' || true)
                if [[ $package_probe == package:* ]]; then
                  ready=1
                  break
                fi
              fi
            fi
            sleep 2
          done

          if [[ $ready -ne 1 ]]; then
            echo 'Android boot completed before required system services and Package Manager were ready.'
            timeout 15 adb -s emulator-5554 shell getprop sys.boot_completed || true
            timeout 15 adb -s emulator-5554 shell service list || true
            exit 1
          fi

          timeout 15 adb -s emulator-5554 shell input keyevent 82
          timeout 15 adb -s emulator-5554 shell settings put global window_animation_scale 0
          timeout 15 adb -s emulator-5554 shell settings put global transition_animation_scale 0
          timeout 15 adb -s emulator-5554 shell settings put global animator_duration_scale 0
          for service in package activity appwidget; do
            service_status=$(timeout 15 adb -s emulator-5554 shell service check "$service" \
              2>&1 | tr -d '\r' || true)
            if ! grep -Fxq "Service $service: found" <<< "$service_status"; then
              echo "Android service $service stopped before instrumentation could start."
              exit 1
            fi
          done
          package_probe=$(timeout 15 adb -s emulator-5554 shell pm path android \
            2>/dev/null | tr -d '\r' || true)
          if [[ $package_probe != package:* ]]; then
            echo 'Package Manager stopped before instrumentation could start.'
            exit 1
          fi
          # The Settings confirmation activity has no accessible root on some API 37.2 builds.
          # Grant the test-only host permission before Gradle installs/runs instrumentation.
          timeout 30 adb -s emulator-5554 install -r \
            SecondsClock/build/outputs/apk/debug/SecondsClock-debug.apk
          timeout 15 adb -s emulator-5554 shell appwidget grantbind \
            --package uk.co.yahoo.p1rpp.secondsclock.debug --user 0
          ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload debug APK
        if: ${{ success() && matrix.sdk-level == '37.2' }}
        uses: actions/upload-artifact@v4
        with:
          name: seconds-clock-debug-apk
          path: SecondsClock/build/outputs/apk/debug/SecondsClock-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload emulator logcat on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: widget-emulator-logcat-api-${{ matrix.sdk-level }}
          path: ${{ runner.temp }}/android-widget-logcat.txt
          if-no-files-found: ignore
