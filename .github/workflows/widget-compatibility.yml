name: Android widget compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  widget-host:
    name: RemoteViews seconds on API ${{ matrix.android-api }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The SDK uses 37.0 in package IDs; 37.2 is currently the QPR2 beta.
        include:
          - android-api: '26'
            sdk-level: '26'
          - android-api: '37.0 (Android 17)'
            sdk-level: '37.0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run AppWidgetHost compatibility test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.sdk-level }}
          system-image-api-level: ${{ matrix.sdk-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
