name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-28' 'build-tools;34.0.0'

      - name: Install launcher icon check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin python3-pil

      - name: Check release metadata
        run: python3 scripts/release.py check

      - name: Test release script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon -PrsvgConvertExecutable=rsvg-convert clean test lint assembleDebug assembleRelease

      - name: Verify generated launcher icon in APKs
        run: python3 scripts/check_launcher_icon.py

  widget-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-28' 'build-tools;34.0.0'

      - name: Enable KVM access
        if: ${{ !env.ACT }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Apply RemoteViews layout tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86
          script: |
            set -eu
            ./gradlew --no-daemon :SecondsClock:assembleDebug
            timeout 30 adb install -r SecondsClock/build/outputs/apk/debug/SecondsClock-debug.apk
            timeout 15 adb shell appwidget grantbind --package uk.co.yahoo.p1rpp.secondsclock.debug --user 0
            ./gradlew --no-daemon :SecondsClock:connectedDebugAndroidTest
