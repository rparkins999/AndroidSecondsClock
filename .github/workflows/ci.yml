name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-28' 'build-tools;34.0.0'

      - name: Check release metadata
        run: python3 scripts/release.py check

      - name: Test release script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon clean test lint assembleDebug assembleRelease
