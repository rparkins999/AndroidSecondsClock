name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-28' 'build-tools;34.0.0'

      - name: Install launcher icon check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin python3-pil

      - name: Check release metadata
        run: python3 scripts/release.py check

      - name: Test release script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon -PrsvgConvertExecutable=rsvg-convert clean test lint assembleDebug assembleRelease

      - name: Verify generated launcher icon in APKs
        run: python3 scripts/check_launcher_icon.py
